# Base H2 en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:shop_menoss_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA para tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Solo para pruebas automatizadas, nunca para produccion
jwt.secret=shop-menoss-test-jwt-key-2026-only-for-tests
jwt.expiration=86400000
