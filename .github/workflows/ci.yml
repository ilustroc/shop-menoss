name: CI - Shop Menoss

on:
  pull_request:
    branches:
      - main
      - codex/tienda-funcional
  push:
    branches:
      - main
      - codex/tienda-funcional
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Java 21 y Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verificar Java y compilador
        run: |
          java -version
          javac -version

      - name: Preparar Maven Wrapper con reintentos
        run: |
          for intento in 1 2 3; do
            if bash ./mvnw --version; then
              exit 0
            fi

            echo "Fallo al preparar Maven. Intento $intento de 3."

            if [ "$intento" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "No se pudo preparar Maven Wrapper."
          exit 1

      - name: Compilar y ejecutar pruebas unitarias con H2
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend - React y TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Compilar frontend (TypeScript + Vite)
        run: npm run build
